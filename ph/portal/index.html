<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Portal de propietarios · Gestión Integral PH</title>
<style>
:root{--azul:#071f50;--azul2:#15479d;--nar:#ff6a00;--nar2:#ff8a00;--tinta:#0b1733;--gris:#64748b;--linea:#dce5f2;--bg:#edf2f8;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--tinta)}
button,input,select,textarea{font:inherit}a{color:var(--azul2)}
.top{background:linear-gradient(120deg,var(--azul),var(--azul2));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.top .k{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--nar),#ff3b6b);display:grid;place-items:center;font-weight:900}
.top .t{flex:1;min-width:0}.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .t span{font-size:12px;opacity:.8}
.top button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:9px;padding:7px 11px;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;margin:0 0 14px;box-shadow:0 6px 18px rgba(7,31,80,.06)}
h1{font-size:22px;margin:4px 0 8px;color:var(--azul)}h2{font-size:17px;margin:0 0 10px;color:var(--azul)}
.muted{color:var(--gris);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:linear-gradient(90deg,var(--nar),var(--nar2));color:#fff;text-decoration:none}
.btn.sec{background:#eef3fb;color:var(--azul)}.btn.pay{background:linear-gradient(90deg,#16a34a,#0d9488)}.btn.full{width:100%}
.btn:disabled{opacity:.6;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--azul);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
input,select,textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:11px;padding:11px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--nar)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:1px solid var(--linea);background:#fff;color:var(--azul);border-radius:999px;padding:8px 13px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.box{border-radius:12px;padding:11px 13px;margin:8px 0;font-weight:600}.box.ok{background:#dcfce7;color:#166534}.box.bad{background:#fee2e2;color:#991b1b}.box.warn{background:#fef3c7;color:#92400e}.box.info{background:#eff6ff;color:#1e3a8a}
.unit{border:1px solid var(--linea);border-radius:14px;padding:13px;margin:10px 0}
.unit .s{font-size:26px;font-weight:800;color:var(--azul)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #eef2f7;vertical-align:top}th{color:var(--gris);font-weight:600;font-size:12px}
td.n{text-align:right;white-space:nowrap}.tw{overflow-x:auto}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}.pill.ok{background:#dcfce7;color:#166534}.pill.warn{background:#fef3c7;color:#92400e}.pill.bad{background:#fee2e2;color:#991b1b}
.item{border-top:1px solid #eef2f7;padding:10px 0}.item:first-child{border-top:0}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 30% 15%,#15479d,#071f50 60%,#020817)}
.login .card{width:min(420px,100%);text-align:center;padding:26px 22px}
.login input{font-size:22px;text-align:center;letter-spacing:.06em}
.err{color:var(--bad);font-weight:600;min-height:20px;margin:10px 0;font-size:14px}
.foot{text-align:center;color:var(--gris);font-size:12px;padding:10px 0 24px}
#doc{display:none}
.vbtn{display:block;width:100%;border:0;border-radius:14px;padding:16px;margin:8px 0;font-size:18px;font-weight:800;color:#fff;cursor:pointer}.vbtn:disabled{opacity:.5}
.bar{height:14px;background:#e8eef8;border-radius:99px;overflow:hidden;margin:3px 0 8px}.bar>i{display:block;height:100%}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ok);font-weight:700}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.25}}
@media print{body{background:#fff}body>*:not(#doc){display:none!important}#doc{display:block!important;color:#111;font:11pt Arial,sans-serif;padding:0 8px}#doc h1{text-align:center;color:#1e3a8a;font-size:15pt}#doc table{font-size:10pt}#doc th,#doc td{border:1px solid #999}}
</style>
</head>
<body>
<div id="app"></div>
<div id="doc"></div>
<script>
(function(){
"use strict";
var SB="https://kdklenfuqafnmdrmpvuo.supabase.co", KEY="sb_publishable_6PO6U3rXvK7q-JUP6dUBCg_gnMcyLyq";
var CODE=(new URLSearchParams(location.search).get("c")||"").toLowerCase().replace(/[^a-z0-9]/g,"");
var app=document.getElementById("app"), D=null, CED="", TAB="inicio";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function cop(v){return "$ "+Math.round(Number(v)||0).toLocaleString("es-CO");}
function fch(d){if(!d)return "";var a=String(d).slice(0,10).split("-");return a.length===3?a[2]+"/"+a[1]+"/"+a[0]:String(d);}
function hoy(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function api(route,body){
  return fetch(SB+"/rest/v1/rpc/krea_api",{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},
    body:JSON.stringify({p_app:"php",p_token:"",p_route:route,p_method:"POST",p_query:{},p_body:body,p_ua:""})})
  .then(function(r){return r.json().catch(function(){return null;}).then(function(j){ if(!r.ok) throw new Error((j&&j.message)||"No hay conexión con el servidor."); if(j&&j.error) throw new Error(j.error); return j;});},
        function(){throw new Error("No hay conexión a internet.");});
}
var LINK_CODE=CODE;
function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,v); }catch(e){ return null; } }
function entrar(code,c,b,err){
  api("login",{code:code,ced:c}).then(function(j){
    if(j&&j.elegir){ if(b){b.disabled=false;b.textContent="Ingresar";}
      document.getElementById("pick").innerHTML='<p class="muted" style="margin:12px 0 6px">Su cédula está registrada en varios conjuntos. Elija uno:</p>'+j.elegir.map(function(x){return '<button class="btn sec full" style="margin:4px 0" data-code="'+esc(x.code)+'">🏢 '+esc(x.nombre)+'</button>';}).join("");
      Array.prototype.forEach.call(document.querySelectorAll("[data-code]"),function(x){x.onclick=function(){entrar(x.getAttribute("data-code"),c,null,err);};});
      return; }
    CED=c; D=j; CODE=j.code||code; ss("php-s",CODE+":"+c); TAB="inicio"; render(); asmStart();
  },function(e){ if(b){b.disabled=false;b.textContent="Ingresar";} err.textContent=e.message; var i=document.getElementById("ced"); if(i) i.select(); });
}
function login(msg){
  D=null; CED=""; CODE=LINK_CODE; ss("php-s",null); ASM=null; clearTimeout(ASM_T);
  document.title="Portal de propietarios";
  app.innerHTML='<div class="login"><div class="card"><div style="font-size:44px">🏠</div><div style="color:var(--nar);font-weight:800;letter-spacing:.08em;font-size:12px;text-transform:uppercase">Portal de propietarios</div>'+
    '<h1>Bienvenido(a)</h1><p class="muted">Ingrese con su <b>número de cédula</b>, el registrado por la administración de su conjunto.</p><input id="ced" inputmode="numeric" autocomplete="off" placeholder="Número de cédula"><div class="err" id="err">'+esc(msg||"")+'</div><button class="btn full" id="go">Ingresar</button><div id="pick"></div>'+
    '<p class="muted" style="margin-top:16px;font-size:11.5px">Gestión Integral PH · Academia KREA · <a href="https://elitnyasesoriayformacion-debug.github.io/politica-de-privacidad/" target="_blank" rel="noopener">Política de privacidad</a></p></div></div>';
  var inp=document.getElementById("ced"), b=document.getElementById("go"), err=document.getElementById("err");
  var go=function(){ var c=inp.value.replace(/\D/g,""); if(c.length<4){err.textContent="Escriba su número de cédula completo.";inp.focus();return;}
    b.disabled=true; b.textContent="Verificando…"; err.textContent=""; document.getElementById("pick").innerHTML="";
    entrar(CODE,c,b,err);
  };
  b.onclick=go; inp.onkeydown=function(e){if(e.key==="Enter")go();}; setTimeout(function(){inp.focus();},60);
}
function payLink(u,valor){var p=D.comun.pago||{};if(!/^https:\/\//i.test(p.url||""))return "";return p.url.replace(/\{valor\}/gi,String(Math.round(Math.max(0,valor||0)))).replace(/\{unidad\}/gi,encodeURIComponent(u.label)).replace(/\{cedula\}/gi,CED);}
function payBtn(i,u){return '<button class="btn pay" data-pay="'+i+'">💳 '+esc((D.comun.pago&&D.comun.pago.texto)||"Pagar en línea")+(u.saldo>0?" · "+cop(u.saldo):"")+'</button>';}
function pagar(u){
  var p=D.comun.pago||{}, valor=u.saldo>0?u.saldo:0;
  if(!/^https:\/\//i.test(p.url||"")){
    var datos=[p.banco,p.cuenta&&("cuenta "+p.cuenta),p.convenio&&("convenio/referencia "+p.convenio)].filter(Boolean).join(" · ");
    alert("El pago en línea aún no está habilitado por la administración de "+String((D.comun.config&&D.comun.config.nombre)||"su conjunto").replace(/\.+$/,"")+"."+(datos?"\n\nPuede pagar por consignación o transferencia: "+datos+".\nIndique como referencia su unidad: "+u.label+".":"\n\nComuníquese con la administración para conocer los medios de pago."));
    return;
  }
  if(valor<=0){
    var v=prompt("Su unidad "+u.label+" está al día.\n\n¿Cuánto desea abonar por anticipado? (solo números)","");
    if(v===null) return; valor=Number(String(v).replace(/[^\d]/g,""))||0;
    if(valor<=0){ alert("Escriba un valor válido."); return; }
  }
  var l=payLink(u,valor);
  if(confirm("Se abrirá la pasarela de pago.\n\nValor: "+cop(valor)+"\nReferencia: "+u.label+(p.nota?"\n\n"+p.nota:"")+"\n\nGuarde el comprobante; la administración aplicará el pago a su estado de cuenta.")) window.open(l,"_blank","noopener");
}
function bindPay(v,P){Array.prototype.forEach.call(v.querySelectorAll("[data-pay]"),function(b){b.onclick=function(){pagar(P.unidades[+b.getAttribute("data-pay")]);};});}
function printDoc(title,html){var c=D.comun.config||{};document.getElementById("doc").innerHTML='<h1>'+esc(c.nombre)+'</h1><p style="text-align:center">'+esc([c.nit&&("NIT "+c.nit),c.direccion,c.ciudad].filter(Boolean).join(" · "))+'</p><h1 style="font-size:13pt">'+esc(title)+'</h1><p style="text-align:center;font-size:9pt">Información con corte al '+fch(D.comun.corte)+' · Portal de propietarios</p><hr>'+html;setTimeout(function(){window.print();},50);}
function firma(){var c=D.comun.config||{};return '<br><br><p>_____________________________<br><b>'+esc(c.administrador||"Administrador(a)")+'</b><br>Administrador(a) y Representante Legal'+(c.ccAdministrador?"<br>C.C. "+esc(c.ccAdministrador):"")+'</p>';}
function movsTable(u){return '<table><tr><th>Fecha</th><th>Concepto</th><th class="n">Cargo</th><th class="n">Abono</th><th class="n">Saldo</th></tr>'+(u.movs.length?u.movs.map(function(m){return '<tr><td>'+fch(m.f)+'</td><td>'+esc(m.c)+(m.rc?" ("+esc(m.rc)+")":"")+'</td><td class="n">'+(m.cargo?cop(m.cargo):"")+'</td><td class="n">'+(m.abono?cop(m.abono):"")+'</td><td class="n">'+cop(m.saldo)+'</td></tr>';}).join(""):'<tr><td colspan="5">Sin movimientos registrados.</td></tr>')+'</table>';}
function send(tipo,data,btn,ok){
  if(btn){btn.disabled=true;btn._t=btn.textContent;btn.textContent="Enviando…";}
  return api("enviar",{code:CODE,ced:CED,tipo:tipo,data:data}).then(function(){ if(btn){btn.disabled=false;btn.textContent=btn._t;} alert(ok||"✓ Enviado a la administración."); },
    function(e){ if(btn){btn.disabled=false;btn.textContent=btn._t;} alert("No se pudo enviar: "+e.message); });
}
function render(){
  var P=D.prop, C=D.comun, cfg=C.config||{};
  document.title=(cfg.nombre||"Portal")+" · Portal de propietarios";
  var tabs=(ASM?[["asamblea","🗳 Asamblea"]]:[]).concat([["inicio","Inicio"]]).concat([["cuenta","Estado de cuenta"],["pqrs","PQRS"],["reservas","Reservas"],["anuncios","Anuncios"],["datos","Mis datos"]]);
  app.innerHTML='<div class="top"><div class="k">K</div><div class="t"><b>'+esc(cfg.nombre||"Copropiedad")+'</b><span>'+esc(P.nombre)+' · C.C. '+esc(CED)+'</span></div><button id="out">Salir</button></div>'+
    '<div class="wrap"><div class="tabs">'+tabs.map(function(t){return '<button data-t="'+t[0]+'" class="'+(t[0]===TAB?"on":"")+'">'+t[1]+'</button>';}).join("")+'</div><div id="v"></div>'+
    '<div class="foot">Información actualizada por la administración el '+fch(C.corte)+'.<br>Gestión Integral PH · Academia KREA</div></div>';
  document.getElementById("out").onclick=function(){login();};
  Array.prototype.forEach.call(app.querySelectorAll(".tabs button"),function(b){b.onclick=function(){TAB=b.getAttribute("data-t");render();window.scrollTo(0,0);};});
  var v=document.getElementById("v"); ({asamblea:vAsamblea,inicio:vInicio,cuenta:vCuenta,pqrs:vPqrs,reservas:vReservas,anuncios:vAnuncios,datos:vDatos}[TAB]||vInicio)(v,P,C);
}
function vInicio(v,P,C){
  var h='<div class="card"><h1>Hola, '+esc((P.nombre||"").split(" ")[0]||"propietario(a)")+'</h1><p class="muted">Este es el resumen de sus unidades en '+esc(String(C.config.nombre||"").replace(/\.+$/,""))+'.</p>';
  P.unidades.forEach(function(u,i){
    h+='<div class="unit"><div class="muted">'+esc(u.label)+(u.coef?" · coeficiente "+esc(u.coef)+"%":"")+'</div><div class="s">'+cop(u.saldo)+'</div>'+
      (u.saldo>0?(u.vencido>0?'<div class="box bad">En mora: '+cop(u.vencido)+' vencido ('+u.diasMora+' días)</div>':'<div class="box warn">Saldo pendiente, aún no vencido</div>'):'<div class="box ok">✓ Está al día</div>')+
      '<div class="row">'+payBtn(i,u)+repBtn(i)+
      '<button class="btn sec" data-ec="'+i+'">Estado de cuenta</button>'+(u.saldo<=0?'<button class="btn sec" data-pz="'+i+'">✅ Paz y salvo</button>':"")+'</div></div>';
  });
  if(!(C.pago&&C.pago.url)&&(C.pago.banco||C.pago.cuenta)) h+='<p class="muted">Pagos: '+esc([C.pago.banco,C.pago.cuenta&&("cuenta "+C.pago.cuenta),C.pago.convenio&&("convenio "+C.pago.convenio)].filter(Boolean).join(" · "))+'. Indique su unidad como referencia.</p>';
  h+='</div>';
  h+=asmBanner();
  if(C.anuncios.length){ var a=C.anuncios[0]; h+='<div class="card"><h2>📢 Último anuncio</h2><b>'+esc(a.titulo)+'</b> <span class="muted">· '+fch(a.fecha)+'</span><p style="white-space:pre-wrap;margin:6px 0 0">'+esc(a.texto)+'</p></div>'; }
  v.innerHTML=h;
  bindPay(v,P); bindRep(v,P);
  var ga=v.querySelector("[data-goasm]"); if(ga) ga.onclick=function(){TAB="asamblea";render();window.scrollTo(0,0);};
  Array.prototype.forEach.call(v.querySelectorAll("[data-ec]"),function(b){b.onclick=function(){TAB="cuenta";render();};});
  Array.prototype.forEach.call(v.querySelectorAll("[data-pz]"),function(b){b.onclick=function(){paz(P.unidades[+b.getAttribute("data-pz")]);};});
}
var VERIF="https://elitnyasesoriayformacion-debug.github.io/ph/portal/?v=";
function qrData(text,cb){ var go=function(){ try{ var box=document.createElement("div"); new window.QRCode(box,{text:text,width:150,height:150,correctLevel:window.QRCode.CorrectLevel.M}); setTimeout(function(){ var cv=box.querySelector("canvas"), im=box.querySelector("img"); cb(cv?cv.toDataURL():(im&&im.src)||""); },60); }catch(e){ cb(""); } };
  if(window.QRCode) return go(); var s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload=go; s.onerror=function(){cb("");}; document.head.appendChild(s); }
function paz(u){
  if(u.saldo>0){alert("No es posible generar el paz y salvo: la unidad tiene un saldo de "+cop(u.saldo)+".");return;}
  var c=D.comun.config||{};
  var cuerpo='<p style="font-size:12pt;line-height:1.8;text-align:justify">La Administración de <b>'+esc(c.nombre)+'</b>'+(c.nit?", identificada con NIT "+esc(c.nit):"")+', <b>CERTIFICA</b> que la unidad privada <b>'+esc(u.label)+'</b>, de propiedad de <b>'+esc(D.prop.nombre)+'</b>, identificado(a) con documento '+esc(CED)+', se encuentra a <b>PAZ Y SALVO</b> por concepto de cuotas de administración, intereses y demás expensas comunes causadas hasta el '+fch(D.comun.corte)+', según la información registrada por la administración.</p><p>Generado desde el portal de propietarios el '+new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})+'.</p>'+firma();
  /* se registra en la nube con un código de verificación (si no hay conexión, se imprime igual que antes) */
  api("certificar",{code:CODE,ced:CED,unidad:u.label}).then(function(j){
    var url=VERIF+j.cert;
    qrData(url,function(src){ printDoc("Paz y salvo",cuerpo+'<div style="margin-top:16px;border:1px solid #999;padding:8px 10px;font-size:9.5pt;display:flex;gap:12px;align-items:center">'+(src?'<img src="'+src+'" style="width:2.6cm;height:2.6cm">':"")+'<div><b>Código de verificación: '+esc(j.cert)+'</b><br>Verifique la autenticidad de este paz y salvo escaneando el código o en:<br>'+esc(url)+'</div></div>'); });
  },function(e){ if(/saldo pendiente/.test(e.message)){ alert(e.message); return; } printDoc("Paz y salvo",cuerpo); });
}
function reportar(u){
  var v=document.getElementById("v");
  v.innerHTML='<div class="card"><h2>🧾 Reportar un pago · '+esc(u.label)+'</h2><p class="muted">Si ya pagó (en la pasarela, por consignación o transferencia), repórtelo aquí. La administración lo verifica con el banco y lo aplica a su estado de cuenta con su recibo de caja.</p>'+
    '<label>Valor pagado</label><input id="xv" inputmode="numeric" value="'+(u.saldo>0?Math.round(u.saldo):"")+'"><label>Fecha del pago</label><input id="xf" type="date" max="'+hoy()+'" value="'+hoy()+'">'+
    '<label>Medio</label><select id="xm"><option>Pasarela en línea / PSE</option><option>Transferencia</option><option>Consignación</option><option>Otro</option></select>'+
    '<label>Número de comprobante o referencia</label><input id="xr" maxlength="80"><label>Observación (opcional)</label><input id="xn" maxlength="300">'+
    '<div class="row"><button class="btn full" id="xs">Enviar reporte</button><button class="btn sec full" id="xc">Cancelar</button></div></div>';
  document.getElementById("xc").onclick=function(){render();};
  document.getElementById("xs").onclick=function(){ var val=Number(document.getElementById("xv").value.replace(/[^\d]/g,""))||0, ref=document.getElementById("xr").value.trim();
    if(val<=0){alert("Escriba el valor pagado.");return;} if(!ref){alert("Escriba el número de comprobante o la referencia del pago.");return;}
    send("pago",{unidad:u.label,valor:val,fecha:document.getElementById("xf").value,medio:document.getElementById("xm").value,referencia:ref,nota:document.getElementById("xn").value.trim()},this,"✓ Pago reportado. La administración lo verificará y lo aplicará a su estado de cuenta.").then(function(){render();}); };
}
function bindRep(v,P){Array.prototype.forEach.call(v.querySelectorAll("[data-rep]"),function(b){b.onclick=function(){reportar(P.unidades[+b.getAttribute("data-rep")]);};});}
function repBtn(i){return '<button class="btn sec" data-rep="'+i+'">🧾 Reportar mi pago</button>';}
function vCuenta(v,P){
  var h="";
  P.unidades.forEach(function(u,i){

  var go=function(){ var c=inp.value.replace(/\D/g,""); if(c.length<4){err.textContent="Escriba su número de cédula completo.";inp.focus();return;}
    b.disabled=true; b.textContent="Verificando…"; err.textContent=""; CED=c;
    asmFetch().then(function(){ if(!ASM){ CED=""; b.disabled=false; b.textContent="Ingresar"; err.textContent="No hay una asamblea en curso con votación en línea para esta cédula."; return; }
      ss("php-a",CODE+":"+c); asmOnlyRender(); asmLoop(); },
      function(e){ CED=""; b.disabled=false; b.textContent="Ingresar"; err.textContent=e.message; inp.select(); });
  };
  b.onclick=go; inp.onkeydown=function(e){if(e.key==="Enter")go();}; setTimeout(function(){inp.focus();},60);
}
function asmOnlyRender(){
  if(!ASM){ asmLogin("La asamblea en línea terminó o no está disponible."); return; }
  document.title=(ASM.nombre||"Asamblea")+" · votación";
  if(!document.getElementById("asmv")){
    app.innerHTML='<div class="top"><div class="k">K</div><div class="t"><b>'+esc(ASM.conjunto||"Asamblea")+'</b><span>Votación en línea · C.C. '+esc(CED)+'</span></div><button id="out">Salir</button></div><div class="wrap"><div id="asmv"></div><div class="foot">Gestión Integral PH · Academia KREA</div></div>';
    document.getElementById("out").onclick=function(){ asmLogin(); };
  }
  paintAsm();
}
function asmResume(){
  var s=String(ss("php-a")||"").split(":");
  if(s.length===2&&s[1]&&(!LINK_CODE||LINK_CODE===s[0])){ CODE=s[0]; CED=s[1]; app.innerHTML='<div class="login"><div class="card"><p>Cargando…</p></div></div>';
    asmFetch().then(function(){ asmOnlyRender(); asmLoop(); },function(e){ asmLogin(e.message); }); }
  else asmLogin();
}
/* Verificación pública de un paz y salvo: ?v=CODIGO */
var VCODE=(new URLSearchParams(location.search).get("v")||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function verificar(){
  app.innerHTML='<div class="login"><div class="card"><div style="font-size:44px">🔎</div><div style="color:var(--nar);font-weight:800;letter-spacing:.08em;font-size:12px;text-transform:uppercase">Verificación de paz y salvo</div><h1>Código '+esc(VCODE)+'</h1><div id="vr" class="muted">Consultando…</div><div class="row"><a class="btn sec full" href="./">Ir al portal de propietarios</a></div></div></div>';
  api("verificar",{cert:VCODE}).then(function(j){ var r=document.getElementById("vr");
    r.innerHTML=j&&j.valido?'<div class="box ok" style="text-align:left">✓ <b>Documento auténtico.</b><br>Paz y salvo expedido para la unidad <b>'+esc(j.unidad)+'</b> de <b>'+esc(j.conjunto)+'</b>, a nombre de <b>'+esc(j.propietario)+'</b>, el '+esc(new Date(j.emitido).toLocaleString("es-CO",{day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"}))+' ('+esc(j.origen)+').<br><span style="font-weight:500">El paz y salvo certifica el estado de la cuenta en esa fecha.</span></div>'
      :'<div class="box bad">✕ <b>Código no encontrado.</b> Este documento no fue expedido por el portal o el código está mal escrito. Consulte con la administración del conjunto.</div>'; },
    function(e){ document.getElementById("vr").innerHTML='<div class="box warn">'+esc(e.message)+'</div>'; });
}
var saved=String(ss("php-s")||"").split(":");
if(VCODE) verificar();
else if(ASMONLY) asmResume();
else if(saved.length===2&&saved[1]&&(!LINK_CODE||LINK_CODE===saved[0])){ app.innerHTML='<div class="login"><div class="card"><p>Cargando…</p></div></div>'; api("login",{code:saved[0],ced:saved[1]}).then(function(j){CED=saved[1];D=j;CODE=j.code||saved[0];render();asmStart();},function(e){login(e.message);}); }
else login();
})();
</script>
